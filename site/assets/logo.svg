<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 92" role="img" aria-label="KVG Enterprises Pvt. Ltd — Knowledge, Value, Growth">
  <title>KVG Enterprises Pvt. Ltd</title>
  <!-- Left mark: 5 vertical rounded bars, alternating brand colours -->
  <g>
    <rect x="0"  y="20" width="9" height="40" rx="4.5" fill="#E74903"/>
    <rect x="14" y="14" width="9" height="52" rx="4.5" fill="#0F6851"/>
    <rect x="28" y="8"  width="9" height="64" rx="4.5" fill="#1A4062"/>
    <rect x="42" y="14" width="9" height="52" rx="4.5" fill="#0F6851"/>
    <rect x="56" y="20" width="9" height="40" rx="4.5" fill="#3D86C6"/>
  </g>
  <!-- Wordmark: K orange, V green, G blue -->
  <g font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="46">
    <text x="82"  y="52" fill="#E74903">K</text>
    <text x="116" y="52" fill="#0F6851">V</text>
    <text x="150" y="52" fill="#3D86C6">G</text>
  </g>
  <!-- Company suffix in blue -->
  <text x="190" y="42" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="19" fill="#3D86C6">Enterprises Pvt. Ltd</text>
  <!-- Tagline with tricolour bullets -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11">
    <circle cx="194" cy="63" r="3" fill="#E74903"/>
    <text x="201" y="67" fill="#1F2933">Knowledge</text>
    <circle cx="266" cy="63" r="3" fill="#3D86C6"/>
    <text x="273" y="67" fill="#1F2933">Value</text>
    <circle cx="315" cy="63" r="3" fill="#0F6851"/>
    <text x="322" y="67" fill="#1F2933">Growth</text>
  </g>
</svg>
